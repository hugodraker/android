name: Android Build

on:
  push:
    branches: [ "main", "master", "dlna-2.3" ]
  pull_request:
    branches: [ "main", "master", "dlna-2.3" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.0.2'

    - name: Build Debug APK
      run: gradle :app:assembleDebug

    - name: Rename APK to dlnad.apk
      run: mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/dlnad.apk
        
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: dlna-server-debug-apk
        path: app/build/outputs/apk/debug/dlnad.apk
