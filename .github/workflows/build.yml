name: Build barcodetyper APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Ensure project structure and files exist
        run: |
          mkdir -p app/src/main/res/layout
          
          if [ ! -f app/src/main/res/layout/activity_scanner.xml ]; then
            cat << 'EOF' > app/src/main/res/layout/activity_scanner.xml
          <?xml version="1.0" encoding="utf-8"?>
          <androidx.constraintlayout.widget.ConstraintLayout 
              xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto"
              android:layout_width="match_parent"
              android:layout_height="match_parent">
              
              <androidx.camera.view.PreviewView
                  android:id="@+id/viewFinder"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  app:layout_constraintBottom_toBottomOf="parent"
                  app:layout_constraintEnd_toEndOf="parent"
                  app:layout_constraintStart_toStartOf="parent"
                  app:layout_constraintTop_toTopOf="parent" />
                  
              <Button
                  android:id="@+id/btnSwitch"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="Switch Camera"
                  app:layout_constraintBottom_toBottomOf="parent"
                  app:layout_constraintEnd_toEndOf="parent"
                  android:layout_margin="16dp" />
                  
          </androidx.constraintlayout.widget.ConstraintLayout>
          EOF
          fi
          
          if [ ! -f gradle.properties ]; then
            echo "android.useAndroidX=true" > gradle.properties
            echo "android.enableJetifier=true" >> gradle.properties
          fi
          
          if [ ! -f settings.gradle ]; then
            echo "pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }" > settings.gradle
            echo "dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }" >> settings.gradle
            echo "rootProject.name = 'barcodetyper'" >> settings.gradle
            echo "include ':app'" >> settings.gradle
          fi
          
          if [ ! -f build.gradle ]; then
            echo "plugins { id 'com.android.application' version '8.3.0' apply false }" > build.gradle
          fi

      - name: Compile & Sign Debug APK
        run: gradle assembleDebug

      - name: Rename APK to barcodetyper
        run: mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/barcodetyper.apk

      - name: Upload Compiled APK
        uses: actions/upload-artifact@v4
        with:
          name: barcodetyper
          path: app/build/outputs/apk/debug/barcodetyper.apk
