name: Build barcodetyper APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Ensure project structure and files exist
        run: |
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/values
          
          echo '<?xml version="1.0" encoding="utf-8"?><resources><string name="app_name">Barcode Typer Keyboard</string></resources>' > app/src/main/res/values/strings.xml
          
          # Create method.xml (Registers the Input Method)
          cat << 'EOF' > app/src/main/res/xml/method.xml
          <?xml version="1.0" encoding="utf-8"?>
          <input-method xmlns:android="http://schemas.android.com/apk/res/android"
              android:settingsActivity="" />
          EOF
          
          # Create qwerty.xml (Keyboard Layout)
          cat << 'EOF' > app/src/main/res/xml/qwerty.xml
          <?xml version="1.0" encoding="utf-8"?>
          <Keyboard xmlns:android="http://schemas.android.com/apk/res/android"
              android:keyWidth="10%p" android:horizontalGap="0px" android:verticalGap="0px" android:keyHeight="50dp">
              <Row>
                  <Key android:codes="113" android:keyLabel="q" android:keyEdgeFlags="left"/>
                  <Key android:codes="119" android:keyLabel="w"/><Key android:codes="101" android:keyLabel="e"/>
                  <Key android:codes="114" android:keyLabel="r"/><Key android:codes="116" android:keyLabel="t"/>
                  <Key android:codes="121" android:keyLabel="y"/><Key android:codes="117" android:keyLabel="u"/>
                  <Key android:codes="105" android:keyLabel="i"/><Key android:codes="111" android:keyLabel="o"/>
                  <Key android:codes="112" android:keyLabel="p" android:keyEdgeFlags="right"/>
              </Row>
              <Row>
                  <Key android:codes="97" android:keyLabel="a" android:keyEdgeFlags="left"/>
                  <Key android:codes="115" android:keyLabel="s"/><Key android:codes="100" android:keyLabel="d"/>
                  <Key android:codes="102" android:keyLabel="f"/><Key android:codes="103" android:keyLabel="g"/>
                  <Key android:codes="104" android:keyLabel="h"/><Key android:codes="106" android:keyLabel="j"/>
                  <Key android:codes="107" android:keyLabel="k"/><Key android:codes="108" android:keyLabel="l" android:keyEdgeFlags="right"/>
              </Row>
              <Row>
                  <Key android:codes="122" android:keyLabel="z" android:keyEdgeFlags="left"/>
                  <Key android:codes="120" android:keyLabel="x"/><Key android:codes="99" android:keyLabel="c"/>
                  <Key android:codes="118" android:keyLabel="v"/><Key android:codes="98" android:keyLabel="b"/>
                  <Key android:codes="110" android:keyLabel="n"/><Key android:codes="109" android:keyLabel="m"/>
                  <Key android:codes="-5" android:keyLabel="DEL" android:isRepeatable="true" android:keyEdgeFlags="right"/>
              </Row>
              <Row>
                  <Key android:codes="32" android:keyLabel="SPACE" android:keyWidth="80%p" android:keyEdgeFlags="left"/>
                  <Key android:codes="-4" android:keyLabel="DONE" android:keyWidth="20%p" android:keyEdgeFlags="right"/>
              </Row>
          </Keyboard>
          EOF
          
          # Create input_view.xml (The UI combining the Camera and Keyboard)
          cat << 'EOF' > app/src/main/res/layout/input_view.xml
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="wrap_content">
              <SurfaceView
                  android:id="@+id/camera_preview"
                  android:layout_width="match_parent"
                  android:layout_height="250dp" />
              <android.inputmethodservice.KeyboardView
                  android:id="@+id/keyboard"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_gravity="bottom"
                  android:background="#88000000"
                  android:keyPreviewLayout="@null" />
          </FrameLayout>
          EOF
          
          if [ ! -f settings.gradle ]; then
            echo "pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }" > settings.gradle
            echo "dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }" >> settings.gradle
            echo "rootProject.name = 'barcodetyper'" >> settings.gradle
            echo "include ':app'" >> settings.gradle
          fi
          
          if [ ! -f build.gradle ]; then
            echo "plugins { id 'com.android.application' version '8.3.0' apply false }" > build.gradle
          fi

      - name: Compile & Sign Debug APK
        run: gradle assembleDebug

      - name: Rename APK to barcodetyper
        run: mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/barcodetyper.apk

      - name: Upload Compiled APK
        uses: actions/upload-artifact@v4
        with:
          name: barcodetyper
          path: app/build/outputs/apk/debug/barcodetyper.apk
