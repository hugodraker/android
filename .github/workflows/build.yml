name: Build Android APK

on:
  push:
    branches: [ "asyncer" ]
  pull_request:
    branches: [ "asyncer" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup exact Gradle version
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.0.2'

    - name: Generate Root Gradle Files
      run: |
        echo "pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }" > settings.gradle
        echo "dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }" >> settings.gradle
        echo "rootProject.name = 'Asyncer'" >> settings.gradle
        echo "include ':app'" >> settings.gradle
        
        echo "plugins { id 'com.android.application' version '8.0.2' apply false }" > build.gradle
        
        echo "android.useAndroidX=false" > gradle.properties
        echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" >> gradle.properties

    - name: Build with Gradle
      run: gradle assembleDebug --no-daemon

    - name: Rename APK
      run: mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/asyncer.apk

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: asyncer
        path: app/build/outputs/apk/debug/asyncer.apk
