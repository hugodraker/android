name: Build NotifSounder APK

on:
  push:
    branches: [ "notifsounder" ]
  pull_request:
    branches: [ "notifsounder" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle 8.0.2
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.0.2'

      - name: Ensure Gradle & XML Config Files Exist
        run: |
          if [ ! -f settings.gradle ]; then
            cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "NotifSounder"
          include ':app'
          EOF
          fi

          if [ ! -f build.gradle ]; then
            cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.0.2' apply false
          }
          EOF
          fi

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=false
          android.suppressUnsupportedCompileSdk=34
          EOF

          if [ -f app/build.gradle ]; then
            sed -i 's/versionName "[^"]*"/versionName "0.1"/g' app/build.gradle
          fi

          if [ -f app/src/main/AndroidManifest.xml ]; then
            sed -i 's/android:versionName="[^"]*"/android:versionName="0.1"/g' app/src/main/AndroidManifest.xml
          fi

          mkdir -p app/src/main/res/xml

          if [ ! -f app/src/main/res/xml/accessibility_config.xml ]; then
            cat << 'EOF' > app/src/main/res/xml/accessibility_config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeNotificationStateChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:notificationTimeout="50" />
          EOF
          fi

          if [ ! -f app/src/main/res/xml/device_admin.xml ]; then
            cat << 'EOF' > app/src/main/res/xml/device_admin.xml
          <?xml version="1.0" encoding="utf-8"?>
          <device-admin xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-policies>
                  <force-lock />
              </uses-policies>
          </device-admin>
          EOF
          fi

      - name: Build Debug APK
        run: |
          gradle assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/notifsounder.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: notifsounder.apk
          path: app/build/outputs/apk/debug/notifsounder.apk
