name: Build Android Scanner

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build APK
      run: ./gradlew assembleDebug

    - name: Rename APK to barcodetyper
      run: mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/barcodetyper.apk

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: barcodetyper
        path: app/build/outputs/apk/debug/barcodetyper.apks
