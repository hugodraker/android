name: Build Android APK

on:
  push:
    branches: [ "traveltimegps", "main", "master" ]
  pull_request:
    branches: [ "traveltimegps", "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Generate Gradle Wrapper (if missing)
      run: gradle wrapper --gradle-version 8.0.2

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew assembleDebug --no-daemon

    - name: Rename APK
      run: mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/traveltimegps.apk

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: traveltimegps
        path: app/build/outputs/apk/debug/traveltimegps.apk
