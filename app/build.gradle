plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.dlnaserver'
    compileSdk 33

    defaultConfig {
        applicationId "com.example.dlnaserver"
        minSdk 9
        targetSdk 29
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    signingConfigs {
        debug {
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            signingConfig signingConfigs.debug
            debuggable true
        }
    }
}

dependencies {
    // Zero external dependencies for Android 2.3 compatibility
}
