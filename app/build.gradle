plugins {
    id 'com.android.application'
}

android {
    namespace 'com.barcodetyper'
    // Keep compileSdk high enough to satisfy the modern AGP build toolchain
    compileSdk 34

    defaultConfig {
        applicationId "com.barcodetyper"
        minSdk 4 
        targetSdk 4
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // ALL dependencies (AndroidX, Material, CameraX, Guava) have been removed.
    // API Level 4 requires building exclusively against the base android.jar.
}