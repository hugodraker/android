plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.dlnaserver'
    compileSdk 33

    defaultConfig {
        applicationId "com.example.dlnaserver"
        minSdk 9  // Android 2.3 Gingerbread
        targetSdk 33
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ".debug"
            debuggable true
        }
    }
}

dependencies {
    // Pure standard Java networking APIs are used; no external library dependencies required.
}
