plugins {
    id 'com.android.application' version '8.0.2'
}

android {
    namespace 'com.example.dlnaserver'
    compileSdk 33

    defaultConfig {
        applicationId "com.example.dlnaserver"
        minSdk 9
        targetSdk 33
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    // Pure standard Java networking APIs; no external libraries required
}
